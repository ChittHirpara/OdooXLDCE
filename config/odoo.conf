[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_user = odoo
db_password = odoo
admin_passwd = admin
# The database the web server shows (so http://localhost:8069/ is the club website, not a database
# picker) is set in docker-compose.yml, on the server's start command. It must NOT be set here:
# this file also applies to test and setup runs, whose web requests would then hit the wrong database.

# Outgoing mail goes to the Mailpit service from docker-compose.yml. Nothing leaves the machine:
# open http://localhost:8025 to read every email Odoo sends (confirmations, invitations, receipts).
# For a real mail server, set one in Settings > Technical > Outgoing Mail Servers instead.
smtp_server = mail
smtp_port = 1025
email_from = hello@championsclub.example
