[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_user = odoo
db_password = odoo
admin_passwd = admin
# The web server serves one database, so http://localhost:8069/ shows the club website straight
# away instead of a database picker. Build it with: bash scripts/create_demo_db.sh club
# (Command-line runs such as `-d club_test` for tests are not affected by this filter.)
db_name = club
dbfilter = ^club$
